services:
  assistente:
    build: .
    env_file: .env
    environment:
      # Nel container localhost è il container stesso: LM Studio sta sull'host.
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
